listen=YES
listen_ipv6=NO

anonymous_enable=NO

local_enable=YES
write_enable=YES
local_umask=022

# Passive ports 21100-21110
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# Chroot local users to their home directory
chroot_local_user=YES
allow_writeable_chroot=YES

xferlog_enable=YES
seccomp_sandbox=NO
